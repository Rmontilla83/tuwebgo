<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3730A3"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <!-- Accent glow -->
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Browser bar gradient -->
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Subtle glow effect -->
  <circle cx="340" cy="180" r="160" fill="url(#glow)"/>

  <!-- Grain texture overlay -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feBlend in="SourceGraphic" mode="multiply" result="grain"/>
  </filter>
  <circle cx="256" cy="256" r="256" fill="white" opacity="0.015" filter="url(#grain)"/>

  <!-- Browser window frame -->
  <rect x="96" y="120" width="320" height="240" rx="24" ry="24"
        fill="none" stroke="white" stroke-width="8" opacity="0.9"/>

  <!-- Browser top bar -->
  <rect x="96" y="120" width="320" height="56" rx="24" ry="24" fill="url(#barGrad)"/>
  <!-- Cut bottom corners of bar -->
  <rect x="96" y="152" width="320" height="24" fill="url(#barGrad)"/>
  <!-- Bar separator line -->
  <line x1="96" y1="176" x2="416" y2="176" stroke="white" stroke-width="1.5" opacity="0.15"/>

  <!-- Traffic light dots -->
  <circle cx="134" cy="148" r="10" fill="#FF5F57"/>
  <circle cx="164" cy="148" r="10" fill="#FEBC2E"/>
  <circle cx="194" cy="148" r="10" fill="#28C840"/>

  <!-- URL bar hint -->
  <rect x="224" y="138" width="170" height="20" rx="10" fill="white" opacity="0.08"/>

  <!-- Code symbol </> inside browser -->
  <text x="256" y="300" text-anchor="middle" font-family="'Space Grotesk','SF Pro Display',system-ui,sans-serif"
        font-size="72" font-weight="700" fill="white" opacity="0.95">&lt;/&gt;</text>

  <!-- Accent bolt / spark -->
  <g transform="translate(370, 105)">
    <circle r="32" fill="#EA580C"/>
    <circle r="32" fill="#EA580C" opacity="0.4">
      <animate attributeName="r" values="32;38;32" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Lightning bolt -->
    <path d="M-4 -14 L4 -2 L-1 -2 L4 14 L-4 2 L1 2 Z"
          fill="white" stroke="none"/>
  </g>

  <!-- Marca de agua inferior: TuWebGo -->
  <text x="256" y="420" text-anchor="middle" font-family="'Space Grotesk','SF Pro Display',system-ui,sans-serif"
        font-size="48" font-weight="700" fill="white" opacity="0.12" letter-spacing="9">TuWebGo</text>
</svg>
